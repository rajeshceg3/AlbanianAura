name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Unit Tests
        run: npx vitest run --coverage

      - name: Run E2E Tests
        run: npx playwright test --project=chromium --project=firefox

      - name: Verify phone and desktop visual behavior
        run: |
          SHOTS=test-results/visual WIDTH=320 npm run verify:visual
          SHOTS=test-results/visual WIDTH=390 npm run verify:visual
          SHOTS=test-results/visual WIDTH=1440 npm run verify:visual

      - name: Verify ambient audio
        run: |
          AUDIO_OUT=verification/audio node scripts/audio-structure.cjs
          AUDIO_OUT=verification/audio node scripts/browser-gate.cjs

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            coverage/
